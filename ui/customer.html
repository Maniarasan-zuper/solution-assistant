<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Workspace</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Markmap deps -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.2/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  </head>
  <body>
    <header>
      <div class="brand"><h1 id="pageTitle">Customer Workspace</h1></div>
      <div class="toolbar">
        <a class="secondary icon-btn" href="./">← Home</a>
        <div class="spacer"></div>
        <button id="btnAddEventTop">Add Event</button>
        <button id="btnAiReview" class="secondary">AI Review</button>
        <button
          id="btnTogglePreview"
          class="secondary"
          title="Show/Hide live preview"
        >
          Live Preview: Off
        </button>
      </div>
    </header>

    <main>
      <section class="left">
        <div class="card">
          <h2 id="custName">—</h2>

          <h3>Events</h3>
          <!-- Hidden when no events exist -->
          <div class="row" id="eventSelectRow" style="display: none">
            <label class="lbl">Select</label>
            <select id="eventSelect" aria-label="Select event"></select>
          </div>

          <!-- Shows only the selected event with rename/delete -->
          <ul id="eventList" class="list small" style="margin-top: 8px"></ul>

          <h3>Flows for Selected Event</h3>
          <div class="row" id="addFlowRow" style="display: none">
            <button id="btnAddFlowOpen" title="Add a new top-level flow">
              Add Flow
            </button>
          </div>

          <div id="flowsBox"></div>
        </div>
      </section>

      <section class="right">
        <div class="card" id="previewCard" style="display: none">
          <div class="card-head">
            <h2>Markup Preview</h2>
            <div class="row">
              <!-- PDF removed -->
              <button
                id="btnDownloadDoc"
                class="secondary"
                title="Download consolidated document"
              >
                Download Doc
              </button>
              <button
                id="btnDownloadMap"
                class="secondary"
                title="Download standalone HTML"
              >
                Download
              </button>
              <button
                id="btnResetView"
                class="secondary"
                title="Recenter & fit the Markmap"
              >
                Reset
              </button>
            </div>
          </div>
          <svg id="mindmap" style="width: 100%; height: 600px"></svg>
        </div>
      </section>
    </main>

    <!-- Shared Modal -->
    <div id="modalBackdrop" class="backdrop hidden"></div>
    <div
      id="modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-head">
        <h3 id="modalTitle">Modal</h3>
        <button id="modalClose" class="icon-btn" title="Close">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>

    <script src="customer.js"></script>
  </body>
</html>
