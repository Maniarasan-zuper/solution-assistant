<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Workflow Markup</title>

    <link rel="stylesheet" href="styles.css" />

    <!-- Markmap deps (preview pane) -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  </head>
  <body>
    <header>
      <div class="brand"><h1>Customer Workflow Markup</h1></div>
      <div class="toolbar">
        <div class="search-wrap">
          <input id="customerSearch" placeholder="Search customers…" />
          <button id="btnClearSearch" title="Clear">×</button>
        </div>
        <div class="spacer"></div>
        <button id="btnAddCustomerTop">Add Customer</button>
        <button id="btnAddEventTop">Add Event</button>
        <button id="btnDownloadMap" title="Download standalone HTML">
          Download HTML
        </button>
        <button id="btnResetView" title="Recenter & fit the Markmap">
          Reset View
        </button>
      </div>
    </header>

    <main>
      <section class="left">
        <div class="card">
          <h2>Search Results</h2>
          <ul id="customerResults" class="list"></ul>
          <p id="searchHint" class="muted">Start typing to search customers.</p>
        </div>

        <!-- Detail & editor stays inline, same as earlier (except Add Event moved to modal) -->
        <div class="card" id="detailCard" style="display: none">
          <h2 id="custName"></h2>
          <div class="row">
            <input id="custEditName" placeholder="Customer name" />
            <input id="custEditNotes" placeholder="Notes" />
            <button id="btnSaveCustomer">Save</button>
            <button id="btnDeleteCustomer" class="danger">Delete</button>
          </div>

          <h3>Events</h3>
          <!-- existing events dropdown (select to work on flows) -->
          <div class="row">
            <select id="eventSelect"></select>
            <!-- Add Event controls are REMOVED from here; use top button -->
          </div>

          <ul id="eventList" class="list small" style="margin-top: 8px"></ul>

          <h3>Flows for Selected Event</h3>
          <div id="flowsBox"></div>

          <div class="row">
            <input id="flowName" placeholder="Flow name" />
            <input id="flowLink" placeholder="Link" />
            <textarea id="flowDesc" placeholder="Description"></textarea>
            <button id="btnAddFlow">Add Flow</button>
          </div>
        </div>
      </section>

      <section class="right">
        <div class="card">
          <div class="card-head">
            <h2 id="previewTitle">Markup Preview</h2>
          </div>
          <svg id="mindmap" style="width: 100%; height: 600px"></svg>
        </div>
      </section>
    </main>

    <!-- Minimal modal infra (used ONLY for Add Customer / Add Event) -->
    <div id="modalBackdrop" class="backdrop hidden"></div>
    <div
      id="modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-head">
        <h3 id="modalTitle">Modal</h3>
        <button id="modalClose" class="icon-btn" title="Close">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
