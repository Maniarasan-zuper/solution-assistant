<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workflow Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="brand"><h1>Customer Workflows</h1></div>
      <div class="toolbar">
        <div class="search-wrap">
          <label for="customerSearch" class="sr-only">Search customers</label>
          <input
            id="customerSearch"
            placeholder="Search customers…"
            autocomplete="off"
          />
          <button id="btnClearSearch" title="Clear">×</button>
        </div>
        <div class="spacer"></div>
        <button id="btnAddCustomerTop">Add Customer</button>
      </div>
    </header>

    <main>
      <section class="left" style="flex: 1">
        <div class="card">
          <h2>Customers</h2>
          <div id="customerGrid" class="grid"></div>
          <p id="gridHint" class="muted">
            Showing recent customers. Use search to filter, or add a new
            customer.
          </p>
        </div>
      </section>
    </main>

    <!-- Modal (Add Customer only) -->
    <div id="modalBackdrop" class="backdrop hidden"></div>
    <div
      id="modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-head">
        <h3 id="modalTitle">Add Customer</h3>
        <button id="modalClose" class="icon-btn" title="Close">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>

    <script src="home.js"></script>
  </body>
</html>
