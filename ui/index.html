<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Customer Workflow Markup</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/index.js"></script>
</head>
<body>
  <header><h1>Customer Workflow Markup</h1></header>
  <main>
    <section class="left">
      <div class="card">
        <h2>Customers</h2>
        <div class="row">
          <input id="newCustomerName" placeholder="New customer name"/>
          <input id="newCustomerNotes" placeholder="Notes (optional)"/>
          <button id="btnAddCustomer">Add Customer</button>
        </div>
        <ul id="customerList" class="list"></ul>
      </div>

      <div class="card" id="detailCard" style="display:none;">
        <h2 id="custName"></h2>
        <div class="row">
          <input id="custEditName" placeholder="Customer name"/>
          <input id="custEditNotes" placeholder="Notes"/>
          <button id="btnSaveCustomer">Save</button>
          <button id="btnDeleteCustomer" class="danger">Delete</button>
        </div>

        <h3>Events</h3>
        <div class="row">
          <select id="eventSelect"></select>
          <input id="newEventName" placeholder="New event name"/>
          <button id="btnAddEvent">Add Event</button>
        </div>
        <ul id="eventList" class="list small"></ul>

        <h3>Flows for Selected Event</h3>
        <div id="flowsBox"></div>

        <div class="row">
          <input id="flowName" placeholder="Flow name"/>
          <input id="flowLink" placeholder="Link"/>
          <textarea id="flowDesc" placeholder="Description"></textarea>
          <button id="btnAddFlow">Add Flow</button>
        </div>
      </div>
    </section>

    <section class="right">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2>Markup Preview</h2>
          <button id="btnDownloadMap" title="Download standalone HTML">Download HTML</button>
        </div>
        <svg id="mindmap" style="width:100%;height:560px;"></svg>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
